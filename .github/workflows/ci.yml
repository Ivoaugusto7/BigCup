name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run tests
        run: |
          cd frontend
          npm run test:ci
      - name: Build frontend
        run: |
          cd frontend
          npm run build

  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build backend
        run: dotnet build backend/backend.csproj
      - name: Check migrations are up to date (both providers)
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.10
          cd backend
          dotnet ef migrations has-pending-model-changes --context SqliteAppDbContext --no-build
          dotnet ef migrations has-pending-model-changes --context SqlServerAppDbContext --no-build
